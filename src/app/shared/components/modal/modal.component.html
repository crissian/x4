<div class="flex items-center justify-between border-b border-line px-4 py-3">
	<h4 class="text-lg font-medium text-fg-strong">{{ title() }}</h4>
	<button
		type="button"
		class="cursor-pointer text-xl leading-none text-fg-muted hover:text-fg-strong"
		i18n-aria-label
		aria-label="Close"
		(click)="dialogRef.close()"
	>
		<svg lucideX />
	</button>
</div>
<div class="p-4"><ng-content /></div>
<div class="flex justify-end gap-2 border-t border-line px-4 py-3 empty:hidden">
	<ng-content select="[footer]" />
</div>
