<label class="block">
	{{ label() }}
	<select class="input" [attr.id]="inputId()" [formField]="field">
		@if (allLabel(); as allLabel) {
			<option value="">{{ allLabel }}</option>
		}
		@for (option of options(); track option.id) {
			<option [value]="option.id">{{ option.name }}</option>
		}
	</select>
</label>
