<ul class="flex flex-col gap-0.5">
	@for (row of rows(); track row.ware) {
		<li class="flex items-baseline justify-between gap-3">
			@if (row.target?.link; as link) {
				<a class="min-w-0 truncate" [routerLink]="link">{{ row.target!.name }}</a>
			} @else {
				<span class="min-w-0 truncate">{{ row.target?.name ?? row.ware }}</span>
			}
			<span class="shrink-0 tabular-nums">{{ row.amount | number: '1.0-0' }}{{ unit() }}</span>
		</li>
	}
</ul>
