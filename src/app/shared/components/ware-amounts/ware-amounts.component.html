<ul class="flex flex-col gap-0.5">
	@for (row of rows(); track row.ware) {
		<li class="flex items-baseline justify-between gap-3">
			@if (row.entity; as ware) {
				<a class="min-w-0 truncate" [routerLink]="['/wares', ware.id]">{{ ware.name }}</a>
			} @else {
				<span class="min-w-0 truncate">{{ row.ware }}</span>
			}
			<span class="shrink-0 tabular-nums">{{ row.amount | number: '1.0-0' }}</span>
		</li>
	}
</ul>
