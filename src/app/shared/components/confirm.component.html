<app-modal [title]="data.title">
	<p [innerHTML]="data.message"></p>
	<ng-container footer>
		<button type="button" class="btn btn-primary" (click)="dialogRef.close(true)" i18n="@@yes">Yes</button>
		<button type="button" class="btn btn-secondary" (click)="dialogRef.close(false)" i18n="@@no">No</button>
	</ng-container>
</app-modal>
