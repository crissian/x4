<app-modal title="Import Plans">
	<p>
		Paste the <span class="text-info italic">constructionplans.xml</span> content below. The plans will be added to
		your saved layout list.
	</p>
	<p class="text-xs text-neutral-400">File can be found in Documents\Egosoft\X4\[12345678]\constructionplans.xml</p>
	<textarea
		class="input mt-2 font-mono text-xs"
		rows="10"
		aria-label="Construction plans XML"
		[formField]="importForm.xml"
	></textarea>
	<ng-container footer>
		<button type="button" class="btn btn-success" (click)="importPlans()" [disabled]="importForm().invalid()">
			Import
		</button>
		<button type="button" class="btn btn-secondary" (click)="dialogRef.close()" i18n="@@cancel">Cancel</button>
	</ng-container>
</app-modal>
