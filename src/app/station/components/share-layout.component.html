<app-modal i18n-title="@@shareLayout" title="Share Layout">
	<div class="flex">
		<input class="input rounded-r-none" [value]="url" readonly i18n-aria-label aria-label="Layout URL" #urlInput />
		<button class="btn btn-secondary shrink-0 rounded-l-none" type="button" (click)="copy(urlInput)">
			@if (copied()) {
				<svg lucideCheck /><span i18n>Copied</span>
			} @else {
				<svg lucideCopy /><span i18n>Copy</span>
			}
		</button>
	</div>
	<ng-container footer>
		<button type="button" class="btn btn-success" (click)="dialogRef.close()" i18n="@@ok">Ok</button>
	</ng-container>
</app-modal>
