<app-modal i18n-title="@@saveLayout" title="Save Layout">
	<form (submit)="$event.preventDefault(); saveLayout()">
		<input
			class="input"
			i18n-aria-label
			aria-label="Layout name"
			i18n-placeholder
			placeholder="Layout name"
			[formField]="saveForm.name"
		/>
	</form>
	<ng-container footer>
		<button
			type="button"
			class="btn btn-success"
			(click)="saveLayout()"
			[disabled]="saveForm().invalid()"
		>
			<svg lucideSave /><span i18n="@@save">Save</span>
		</button>
		<button type="button" class="btn btn-secondary" (click)="dialogRef.close()" i18n="@@cancel">Cancel</button>
	</ng-container>
</app-modal>

<ng-template #existsMessage let-name>
	<ng-container i18n
		><strong>{{
			name // i18n(ph="name")
		}}</strong>
		already exists. Confirm overwrite?</ng-container
	>
</ng-template>
