<app-modal i18n-title="@@saveLayout" title="Save Layout">
	<form (submit)="$event.preventDefault(); saveLayout()">
		<input class="input" aria-label="Layout name" placeholder="Layout name" [formField]="saveForm.name" />
	</form>
	<ng-container footer>
		<button
			type="button"
			class="btn btn-success"
			(click)="saveLayout()"
			[disabled]="saveForm().invalid()"
		>
			<svg lucideSave /><span i18n="@@save">Save</span>
		</button>
		<button type="button" class="btn btn-secondary" (click)="dialogRef.close()" i18n="@@cancel">Cancel</button>
	</ng-container>
</app-modal>
