<app-modal i18n-title="@@loadLayout" title="Load Layout">
	<div class="divide-y divide-neutral-700 overflow-hidden rounded-md border border-neutral-700">
		@for (entity of entities(); track entity.name) {
			<div
				class="cursor-pointer px-4 py-2.5 hover:bg-white/5"
				role="button"
				tabindex="0"
				(click)="close(entity, LoadLayoutType.load)"
				(keydown.enter)="close(entity, LoadLayoutType.load)"
			>
				<div class="flex flex-wrap items-center justify-between gap-2">
					<strong>{{ entity.name }}</strong>
					<div class="text-xs">
						<button
							type="button"
							class="link-button text-sky-400"
							i18n="@@loadLayoutLink"
							(click)="close(entity, LoadLayoutType.load, $event)"
						>
							Load Layout
						</button>
						|
						<button
							type="button"
							class="link-button text-neutral-300"
							i18n="@@addModules"
							(click)="close(entity, LoadLayoutType.add, $event)"
						>
							Add Modules
						</button>
						|
						<button
							type="button"
							class="link-button text-red-400"
							i18n="@@delete"
							(click)="deleteLayout(entity, $event)"
						>
							Delete Layout
						</button>
					</div>
				</div>
				<div class="text-xs text-neutral-400">{{ getModules(entity) }}</div>
			</div>
		} @empty {
			<div class="px-4 py-3 text-neutral-400">No saved layouts.</div>
		}
	</div>
	<ng-container footer>
		<button type="button" class="btn btn-secondary" (click)="dialogRef.close()" i18n="@@cancel">Cancel</button>
	</ng-container>
</app-modal>
