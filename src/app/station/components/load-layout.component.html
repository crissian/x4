<app-modal i18n-title="@@loadLayout" title="Load Layout">
	@if (importMessage(); as message) {
		<p class="mb-3" [class.text-danger]="message.error" [class.text-success]="!message.error">{{ message.text }}</p>
	}
	<div class="divide-y divide-line overflow-hidden rounded-md border border-line">
		@for (entity of entities(); track entity.name) {
			<div
				class="cursor-pointer px-4 py-2.5 hover:bg-hover"
				role="button"
				tabindex="0"
				(click)="close(entity, LoadLayoutType.load)"
				(keydown.enter)="close(entity, LoadLayoutType.load)"
			>
				<div class="flex flex-wrap items-center justify-between gap-2">
					<strong>{{ entity.name }}</strong>
					<div class="flex items-center gap-1 text-xs">
						<button
							type="button"
							class="link-button inline-flex items-center gap-1 text-link"
							(click)="close(entity, LoadLayoutType.load, $event)"
						>
							<svg lucideFolderOpen /><span i18n="@@loadLayoutLink">Load Layout</span>
						</button>
						|
						<button
							type="button"
							class="link-button inline-flex items-center gap-1 text-fg-soft"
							(click)="close(entity, LoadLayoutType.add, $event)"
						>
							<svg lucideListPlus /><span i18n="@@addModules">Add Modules</span>
						</button>
						|
						<button
							type="button"
							class="link-button inline-flex items-center gap-1 text-danger"
							(click)="deleteLayout(entity, $event)"
						>
							<svg lucideTrash /><span i18n="@@delete">Delete Layout</span>
						</button>
					</div>
				</div>
				<div class="text-xs text-fg-muted">{{ getModules(entity) }}</div>
			</div>
		} @empty {
			<div class="px-4 py-3 text-fg-muted" i18n>No saved layouts.</div>
		}
	</div>
	<ng-container footer>
		<button
			type="button"
			class="btn btn-info mr-auto"
			[disabled]="entities().length === 0"
			(click)="exportLayouts()"
			i18n-title
			title="Download all saved layouts as a backup file"
		>
			<svg lucideDownload /><span i18n="@@exportLayouts">Export</span>
		</button>
		<input #file type="file" accept=".json,application/json" class="hidden" (change)="importLayouts($event)" />
		<button
			type="button"
			class="btn btn-info"
			(click)="file.click()"
			i18n-title
			title="Add the layouts of an exported backup file"
		>
			<svg lucideUpload /><span i18n="@@importLayouts">Import</span>
		</button>
		<button type="button" class="btn btn-secondary" (click)="dialogRef.close()" i18n="@@cancel">Cancel</button>
	</ng-container>
</app-modal>

<ng-template #deleteMessage let-name>
	<ng-container i18n
		>Are you sure you want to delete
		<strong>{{
			name // i18n(ph="name")
		}}</strong
		>?</ng-container
	>
</ng-template>
