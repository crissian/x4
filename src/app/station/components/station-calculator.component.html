<div class="card">
	<div class="card-header flex flex-wrap gap-2">
		<button (click)="newLayout()" class="btn btn-info" type="button">
			<svg lucideFilePlus /><span i18n="@@newLayout">New</span>
		</button>
		<button (click)="saveLayout()" class="btn btn-primary" type="button">
			<svg lucideSave /><span i18n="@@save">Save</span>
		</button>
		<button (click)="saveLayoutAs()" class="btn btn-primary" type="button">
			<svg lucideSaveAll /><span i18n="@@saveAs">Save As</span>
		</button>
		<button (click)="loadLayout()" class="btn btn-info" type="button">
			<svg lucideFolderOpen /><span i18n="@@load">Load</span>
		</button>
		<button (click)="shareLayout()" class="btn btn-secondary" type="button">
			<svg lucideShare2 /><span i18n="@@share">Share</span>
		</button>
		<button (click)="importPlans()" class="btn btn-dark" type="button">
			<svg lucideImport /><span i18n="@@import">Import</span>
		</button>
	</div>
	<div class="card-body">
		<app-messages [(messages)]="messages" />
		<app-import-result [(result)]="importResult" (selectPlan)="onSelectPlan($event)" />

		<div class="grid gap-6 lg:grid-cols-3">
			<section>
				<div class="mb-2 flex items-center gap-2">
					<h6 class="mb-0 flex-1">{{ layout()?.name || stationModulesTitle }}</h6>
					<label for="sun-light" class="whitespace-nowrap" i18n>Sun Light</label>
					<div class="flex items-center">
						<input
							type="number"
							id="sun-light"
							class="input w-20 rounded-r-none"
							[formField]="settingsForm.sunlight"
						/>
						<span
							class="rounded-r-md border border-l-0 border-line-strong bg-surface-2 px-2 py-1 text-fg-soft"
							>%</span
						>
					</div>
				</div>

				<app-station-modules
					[rows]="rowsForm"
					[modules]="modules()"
					[sunlight]="settings().sunlight"
					[partialWorkforce]="partialWorkforce()"
				/>
			</section>
			<section>
				<h6 i18n>Station Resources</h6>
				<app-station-resources [resources]="resources()" />
			</section>
			<section>
				<h6 i18n>Station Summary</h6>
				<app-station-summary
					[modules]="modules()"
					[resources]="resources()"
					[workforce]="workforce()"
					[settings]="settingsForm"
				/>
			</section>
		</div>
	</div>
</div>
