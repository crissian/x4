<table class="table table-hover">
	<thead>
		<tr>
			<th i18n="@@module" scope="col">Module</th>
			<th i18n="@@count" scope="col" class="w-28">Count</th>
			<th scope="col" class="w-6"><span class="sr-only">Move</span></th>
			<th scope="col" class="w-6"><span class="sr-only">Remove</span></th>
		</tr>
	</thead>
	<tbody cdkDropList (cdkDropListDropped)="drop($event)">
		@for (row of rows(); track row; let i = $index) {
			<tr cdkDrag cdkDragLockAxis="y">
				<td>
					<div *cdkDragPreview class="rounded-md bg-raised px-5 py-4 text-fg-strong shadow-2xl">
						{{ modules()[i]?.module?.name || '( Select )' }}
					</div>
					<app-autocomplete
						[id]="row.moduleId().value()"
						[groups]="wareGroups"
						(selectModule)="onSelectModule($event, i)"
					/>
				</td>
				<td>
					<input
						type="number"
						class="input"
						placeholder="Module Count"
						aria-label="Module Count"
						[formField]="row.count"
					/>
				</td>
				<td>
					<svg lucideGripVertical class="cursor-move text-fg-muted" cdkDragHandle />
				</td>
				<td>
					<button
						type="button"
						class="cursor-pointer text-fg-muted hover:text-danger"
						aria-label="Remove module"
						(click)="removeModule(i)"
					>
						<svg lucideTrash />
					</button>
				</td>
			</tr>
		}
	</tbody>
	<tfoot>
		<tr>
			<th colspan="4" class="pt-3">
				<div class="flex flex-wrap gap-2">
					<button (click)="addModule()" class="btn btn-secondary" type="button">
						<svg lucideSquarePlus /><span>Add Module</span>
					</button>
					<button (click)="autofillModules()" class="btn btn-info" type="button">
						<svg lucideWandSparkles /><span>Autofill Modules</span>
					</button>
				</div>
			</th>
		</tr>
	</tfoot>
</table>
