@if (result(); as result) {
	<app-alert [type]="status().type" (closed)="this.result.set(null)">
		<div>{{ status().message }}</div>
		@if (result.layouts.length) {
			<div class="text-xs">
				@for (item of result.layouts; track $index; let last = $last) {
					<button type="button" class="link-button text-link underline" (click)="selectPlan.emit(item)">
						{{ item }}
					</button>
					@if (!last) {
						<span> | </span>
					}
				}
			</div>
		}
	</app-alert>
}
