<div class="autocomplete-container">
	<input
		type="search"
		class="form-control form-control-sm"
		i18n-placeholder="@@select"
		placeholder="( Select )"
		[(ngModel)]="inputString"
		(ngModelChange)="changed($event)"
		(focus)="onFocus()"
		(blur)="onBlur()"
	/>
	@if (visible) {
		<div tabindex="0" class="autocomplete" (focus)="onFocus()" (blur)="onBlur()">
			@for (group of filteredGroups; track group) {
				@if (group.modules.length > 0) {
					<div class="autocomplete__group-container">
						<label class="autocomplete__group-title"
							><b>{{ group.name }}</b></label
						>
						@for (module of group.modules; track module) {
							<div class="autocomplete__group-item" (click)="onClick(module)">
								<label>{{ module.name }}</label>
							</div>
						}
					</div>
				}
			}
		</div>
	}
</div>
