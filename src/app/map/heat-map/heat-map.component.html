<div class="min-w-0">
	<div
		#area
		class="relative touch-none overflow-hidden rounded border border-line bg-[#05080f] select-none"
		[class]="fill() ? 'size-full' : 'box'"
		role="region"
		[attr.aria-label]="mapLabel()"
		(wheel)="surface.wheel($event)"
		(pointerdown)="surface.pointerDown($event)"
		(pointermove)="surface.pointerMove($event)"
		(pointerup)="up($event)"
		(pointercancel)="surface.pointerUp($event)"
	>
		<svg class="absolute inset-0 size-full" [attr.viewBox]="panZoom.viewBox()" preserveAspectRatio="xMidYMid meet">
			@for (cell of cells(); track cell.shape.sector.id) {
				@if (cell.value === undefined) {
					<polygon
						[attr.points]="cell.shape.points"
						fill="#94a3b8"
						fill-opacity="0.04"
						stroke="#94a3b8"
						stroke-opacity="0.25"
						stroke-width="1"
						vector-effect="non-scaling-stroke"
					>
						<svg:title>{{ cell.title }}</svg:title>
					</polygon>
				} @else {
					<polygon
						class="cursor-pointer outline-none focus-visible:stroke-white"
						role="button"
						tabindex="0"
						[attr.data-sector]="cell.shape.sector.id"
						[attr.aria-label]="cell.title"
						[attr.points]="cell.shape.points"
						[attr.fill]="cell.color"
						[attr.fill-opacity]="cell.outside ? 0.4 : 0.85"
						[attr.stroke]="cell.inArea ? '#e2e8f0' : '#05080f'"
						[attr.stroke-width]="cell.inArea ? 1.5 : 1"
						[attr.data-area]="cell.inArea ? '' : null"
						[attr.data-outside]="cell.outside ? '' : null"
						vector-effect="non-scaling-stroke"
						(keydown.enter)="pick($event, cell.shape.sector.id)"
						(keydown.space)="pick($event, cell.shape.sector.id)"
					>
						<svg:title>{{ cell.title }}</svg:title>
					</polygon>
				}
			}
			@if (centreShape(); as centre) {
				<polygon
					[attr.data-centre]="centre.sector.id"
					class="pointer-events-none"
					[attr.points]="centre.points"
					fill="none"
					stroke="#facc15"
					stroke-width="3"
					vector-effect="non-scaling-stroke"
				/>
			}
			@for (marker of markerShapes(); track marker.sector) {
				<g class="cursor-pointer" [attr.data-sector]="marker.sector" data-marker>
					<polygon
						[attr.points]="marker.points"
						fill="#facc15"
						stroke="#05080f"
						stroke-width="1"
						vector-effect="non-scaling-stroke"
					/>
					<text
						class="pointer-events-none font-bold"
						[attr.x]="marker.x"
						[attr.y]="marker.y + marker.size * 0.2"
						[attr.font-size]="marker.size * 0.6"
						text-anchor="middle"
						fill="#05080f"
					>
						{{ marker.label }}
					</text>
				</g>
			}
		</svg>

		<app-map-zoom-buttons
			resetLabel="Show the whole galaxy"
			i18n-resetLabel
			[expandable]="false"
			(zoomIn)="zoom(0.7)"
			(zoomOut)="zoom(1.4)"
			(fit)="reset()"
		/>
	</div>
	<div class="mt-1 flex items-center gap-2 text-xs text-fg-muted" data-legend>
		<span>{{ lowLabel() }}</span>
		<div class="flex h-3 flex-1 overflow-hidden rounded">
			@for (color of swatches(); track $index) {
				<span class="h-full flex-1" [style.background]="color"></span>
			}
		</div>
		<span>{{ highLabel() }}</span>
	</div>
</div>
