<svg:g
	appStationMarkers
	[markers]="stations.stationMarkers()"
	[scale]="store.scale()"
	[fontSize]="store.fontSize()"
	(stationHover)="show($event)"
/>

@for (badge of badges(); track badge.sector) {
<svg:g
	appMapCountBadge
	[x]="badge.x"
	[y]="badge.y"
	[count]="badge.count"
	[title]="badge.title"
	[radius]="badge.radius"
	[showCount]="badge.radius * store.scale() >= 5"
/>
}
