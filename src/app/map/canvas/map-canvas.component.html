<div
	class="relative block h-[calc(100vh-10rem)] min-h-[420px] touch-none overflow-hidden rounded-b-lg bg-[#05080f] select-none"
>
	<svg class="absolute inset-0 size-full" [attr.viewBox]="store.viewBox()" preserveAspectRatio="xMidYMid meet">
		<defs>
			<radialGradient id="map-glow">
				<stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.35" />
				<stop offset="100%" stop-color="#05080f" stop-opacity="0" />
			</radialGradient>
			<!-- diagonal red lines over contested sectors, spaced by the label size so their density stays fixed on screen -->
			@let hatch = store.fontSize() * 0.6;
			<pattern
				id="map-contested"
				patternUnits="userSpaceOnUse"
				patternTransform="rotate(45)"
				[attr.width]="hatch"
				[attr.height]="hatch"
			>
				<line
					x1="0"
					y1="0"
					x2="0"
					[attr.y2]="hatch"
					stroke="#f87171"
					stroke-opacity="0.7"
					[attr.stroke-width]="hatch * 0.25"
				/>
			</pattern>
		</defs>
		<rect
			[attr.x]="store.layout.bounds.x"
			[attr.y]="store.layout.bounds.y"
			[attr.width]="store.layout.bounds.w"
			[attr.height]="store.layout.bounds.h"
			fill="url(#map-glow)"
		/>

		@for (shape of store.visibleShapes(); track shape.sector.id) {
			@let fill = store.fills().get(shape.sector.id);
			@let selected = store.selected() === shape.sector.id;
			@let dim = saveSectors.unknown().has(shape.sector.id) ? 0.4 : 1;
			@let isContested = saveSectors.contested().has(shape.sector.id);
			<polygon
				class="cursor-pointer"
				[attr.data-sector]="shape.sector.id"
				[attr.points]="shape.points"
				[attr.fill]="fill?.fill"
				[attr.fill-opacity]="store.hovered()?.shape === shape ? 0.95 : fill ? fill.opacity * dim : null"
				[attr.stroke]="selected ? '#fde047' : isContested ? '#f87171' : '#94a3b8'"
				[attr.stroke-opacity]="selected || isContested ? 1 : 0.45 * dim"
				[attr.stroke-width]="selected ? 3 : isContested ? 2 : 1"
				vector-effect="non-scaling-stroke"
				(pointermove)="onPointerMove($event, shape)"
			/>
			@if (isContested) {
				<polygon [attr.points]="shape.points" fill="url(#map-contested)" pointer-events="none" />
			}
		}

		<g appMapLinks />
		<g appMapMarkers />
		@if (save.active()) {
			<g appMapSaveMarkers />
		}
		<g appMapLabels />
	</svg>

	<div class="absolute top-3 right-3 flex flex-col gap-1" (pointerdown)="$event.stopPropagation()">
		<button type="button" class="btn btn-dark" title="Zoom in" i18n-title (click)="zoom(0.7)">
			<svg lucideZoomIn />
		</button>
		<button type="button" class="btn btn-dark" title="Zoom out" i18n-title (click)="zoom(1.4)">
			<svg lucideZoomOut />
		</button>
		<button type="button" class="btn btn-dark" title="Show the whole galaxy" i18n-title (click)="store.resetView()">
			<svg lucideExpand />
		</button>
	</div>

	<app-map-legend />
	<app-map-menu />
	<app-map-tooltip />
	<app-station-tooltip [hover]="stations.hovered()" [size]="store.size()" />
</div>
