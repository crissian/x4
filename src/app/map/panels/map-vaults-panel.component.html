<div class="mb-2 flex flex-wrap gap-x-4 gap-y-1 text-sm">
	<label class="flex items-center gap-1.5">
		<input type="checkbox" [formField]="map.layerForm.show" />
		<ng-container i18n>Show on map</ng-container>
	</label>
	<label class="flex items-center gap-1.5">
		<input type="checkbox" [formField]="map.vaults.positionsForm.show" />
		<ng-container i18n>Show positions</ng-container>
	</label>
</div>
<p class="mb-2 text-sm">
	<ng-container i18n>{{ map.progress().done }} of {{ map.progress().total }} found</ng-container>
	@if (!map.vaults.saveActive()) {
		<!-- prettier-ignore -->
		<span class="block text-xs text-fg-muted" i18n>Tick the vaults you found, or <a routerLink="/saves">load a save</a> to see which you opened.</span>
	}
</p>
<app-vault-table [groups]="map.groups()" />
<!-- prettier-ignore -->
<p class="mt-2 text-xs text-fg-muted" i18n> Repair the signal leaks of a data vault to unlock its timeline entry; the Erlking vaults hold the blueprints of its equipment. </p>
