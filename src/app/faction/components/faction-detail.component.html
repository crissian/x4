@if (entity(); as entity) {
	<app-detail-page
		section="Factions"
		sectionLink="/factions"
		[title]="entity.name"
		[id]="entity.id"
		[description]="entity.description"
	>
		<dl class="details mb-4 max-w-xl">
			<div appDetail="Race">
				@if (entity.race) {
					<a [routerLink]="['/races', entity.race.id]">{{ entity.race.name }}</a>
				} @else {
					-
				}
			</div>
		</dl>
		@if (entity.licenses?.length) {
			<div class="card">
				<div class="card-header">Licenses</div>
				<div class="card-body">
					<app-data-grid [data]="entity.licenses" [columns]="licenseColumns" [features]="false" />
				</div>
			</div>
		}
	</app-detail-page>
}
