@if (entity(); as entity) {
	<app-detail-page
		i18n-section
		section="Factions"
		sectionLink="/factions"
		[title]="entity.name"
		[id]="entity.id"
		[description]="entity.description"
	>
		<dl class="details mb-4 max-w-xl">
			<div i18n-appDetail appDetail="Race">
				<app-entity-link route="/races" [entity]="entity.race" />
			</div>
		</dl>
		@if (entity.licenses?.length) {
			<div class="card">
				<div class="card-header" i18n>Licenses</div>
				<div class="card-body">
					<app-data-grid [data]="entity.licenses" [columns]="licenseColumns" [features]="false" />
				</div>
			</div>
		}
	</app-detail-page>
}
