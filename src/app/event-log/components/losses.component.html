@if (store.losses().length === 0) {
	<p class="text-sm text-fg-muted" i18n>
		Your logbook reports no destroyed ships or stations. The game logs every player-owned ship or station it loses,
		with the killer when one was recorded.
	</p>
} @else {
	<div class="grid gap-3 sm:grid-cols-3">
		<app-stat-tile
			label="Losses"
			i18n-label
			[value]="store.summary().total"
			detail="Ships and stations destroyed, matching the filters."
			i18n-detail
		/>
		<app-stat-tile
			label="Per sector"
			i18n-label
			[items]="sectors()"
			pickTitle="Show only this sector"
			i18n-pickTitle
			(picked)="store.filter({ sector: $event })"
		/>
		<app-stat-tile
			label="Most frequent killers"
			i18n-label
			[items]="killers()"
			pickTitle="Show only this killer"
			i18n-pickTitle
			empty="No killer recorded"
			i18n-empty
			(picked)="store.filter({ search: $event })"
		/>
	</div>
	<div class="mt-4">
		<app-data-grid
			[data]="store.filteredLosses()"
			[columns]="columns.losses"
			[cells]="{ sector: sectorCell }"
			[trackBy]="trackBy"
			[sort]="columns.newest"
			[pageSizes]="pageSizes"
			[compact]="true"
			storageKey="event-log-losses"
		/>
	</div>
}

<ng-template #sectorCell let-row
	><app-sector-map-link [sector]="row.sector?.id" [name]="row.sector?.name" [fallback]="row.loss.location"
/></ng-template>
