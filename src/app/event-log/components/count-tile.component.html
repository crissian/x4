<section class="h-full rounded-md border border-line bg-surface-2 p-3 text-sm">
	<h3 class="mb-1 text-fg-muted">{{ heading() }}</h3>
	<ul class="space-y-0.5">
		@for (item of items(); track item.key) {
			<li class="flex justify-between gap-2" [class.text-fg-muted]="item.muted">
				@if (pickTitle() && !item.muted) {
					<button
						type="button"
						class="link-button truncate text-left"
						[title]="pickTitle()"
						(click)="picked.emit(item.key)"
					>
						{{ item.label }}
					</button>
				} @else {
					<span class="truncate">{{ item.label }}</span>
				}
				<span class="font-medium">{{ item.count }}</span>
			</li>
		} @empty {
			<li class="text-fg-muted">{{ empty() }}</li>
		}
	</ul>
</section>
