<ng-template #effect let-row>
	@if (row.range) {
		<span
			class="font-semibold tabular-nums"
			[class.text-success]="row.tone === 'good'"
			[class.text-danger]="row.tone === 'bad'"
			[class.text-warning]="row.tone === 'mixed'"
			>{{ row.range }}</span
		>
		<span [attr.title]="row.description">{{ row.name }}</span>
	} @else {
		<span class="font-semibold">{{ row.name }}</span>
		@if (row.description) {
			<span class="text-sm text-fg-muted">{{ row.description }}</span>
		}
	}
</ng-template>

<ul class="space-y-1">
	<li class="flex flex-wrap items-baseline gap-x-2">
		<ng-container *ngTemplateOutlet="effect; context: { $implicit: main() }" />
	</li>
</ul>
@if (bonus(); as bonus) {
	<p class="mt-2 mb-1 text-sm text-fg-muted" [attr.title]="bonus.tooltip">{{ bonus.heading }}</p>
	<ul class="space-y-1">
		@for (row of bonus.rows; track row.stat) {
			<li class="flex flex-wrap items-baseline gap-x-2">
				<ng-container *ngTemplateOutlet="effect; context: { $implicit: row }" />
			</li>
		}
	</ul>
}
