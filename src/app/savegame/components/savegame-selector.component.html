@if (saves().length > 0) {
	<label class="inline-flex shrink-0 items-center gap-1 text-nav-fg" i18n-title title="Active savegame">
		<svg lucideSave class="hidden opacity-80 sm:inline-block" />
		<select
			class="input h-8 w-18 py-0 text-sm sm:w-auto sm:max-w-56"
			i18n-aria-label
			aria-label="Active savegame"
			[formField]="selectorForm.active"
		>
			<option value="" i18n>No save</option>
			@for (save of saves(); track save.id) {
				<option [value]="save.id">{{ label(save) }}</option>
			}
		</select>
	</label>
	<a
		routerLink="/saves"
		routerLinkActive="!text-fg-strong bg-nav-active"
		class="inline-flex size-9 shrink-0 items-center justify-center rounded-md text-nav-fg hover:bg-hover hover:text-fg-strong"
		i18n-title
		title="Manage savegames"
		i18n-aria-label
		aria-label="Manage savegames"
		><svg lucideFolderOpen
	/></a>
} @else {
	<a
		routerLink="/saves"
		class="inline-flex h-8 shrink-0 items-center gap-1.5 rounded-md px-2 text-sm text-nav-fg hover:bg-hover hover:text-fg-strong hover:no-underline"
		i18n-title
		title="Load a savegame"
		><svg lucideSave class="opacity-80" /><span class="hidden sm:inline" i18n>Load save</span></a
	>
}
