<div class="flex flex-wrap items-end gap-x-6 gap-y-3">
	<label class="text-sm">
		<ng-container i18n>Search</ng-container>
		<input
			id="achievement-search"
			class="input"
			type="search"
			placeholder="Id or note"
			i18n-placeholder
			[formField]="form.search"
		/>
	</label>
	<label class="text-sm">
		<ng-container i18n>Category</ng-container>
		<select id="achievement-category" class="input" [formField]="form.category">
			<option value="" i18n>All categories</option>
			@for (category of store.categories; track category.value) {
				<option [value]="category.value">{{ category.label }}</option>
			}
		</select>
	</label>
	<label class="text-sm">
		<ng-container i18n>DLC</ng-container>
		<select id="achievement-dlc" class="input" [formField]="form.version">
			<option value="" i18n>Base game and all DLCs</option>
			@for (version of store.versions; track version.version) {
				<option [value]="'' + version.version">{{ version.label }}</option>
			}
		</select>
	</label>
	<label class="flex items-center gap-2 pb-2 text-sm">
		<input id="achievement-hide-done" type="checkbox" [formField]="form.hideDone" />
		<ng-container i18n>Hide done</ng-container>
	</label>
	<label class="flex items-center gap-2 pb-2 text-sm">
		<input id="achievement-spoilers" type="checkbox" [formField]="form.spoilers" />
		<ng-container i18n>Show story spoilers</ng-container>
	</label>
</div>
