<header class="flex items-center gap-3 bg-nav px-4 shadow-lg dark:shadow-black/40">
	<nav class="-mb-px flex min-w-0 flex-1 overflow-x-auto">
		@for (link of links; track link.path) {
			<a
				[routerLink]="link.path"
				routerLinkActive="!text-fg-strong bg-nav-active"
				class="px-3 py-3 whitespace-nowrap text-nav-fg hover:bg-hover hover:text-fg-strong hover:no-underline"
				>{{ link.label }}</a
			>
		}
	</nav>

	<button
		type="button"
		role="switch"
		class="relative inline-flex h-7 w-13 shrink-0 cursor-pointer items-center rounded-full border border-line-strong bg-surface-2 transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-500"
		[attr.aria-checked]="theme.isDark()"
		aria-label="Dark theme"
		[title]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
		(click)="theme.toggle()"
	>
		<span
			class="absolute top-0.5 left-0.5 flex size-5.5 items-center justify-center rounded-full bg-white text-xs text-amber-500 shadow transition-transform dark:translate-x-6 dark:bg-neutral-900 dark:text-sky-300"
		>
			<i class="fa-solid" [class.fa-sun]="!theme.isDark()" [class.fa-moon]="theme.isDark()"></i>
		</span>
	</button>

	<a
		class="group inline-flex h-8 shrink-0 items-center gap-1.5 rounded-full border border-line-strong bg-surface-2/60 px-2.5 text-sm text-nav-fg transition-colors hover:border-amber-400 hover:bg-amber-50 hover:text-amber-800 hover:no-underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-400 sm:px-3 dark:hover:border-amber-400/60 dark:hover:bg-amber-400/10 dark:hover:text-amber-200"
		target="_blank"
		rel="noopener"
		href="https://www.buymeacoffee.com/crissian"
		title="Enjoying the planner? Buy me a coffee"
		aria-label="Buy me a coffee"
		><i
			class="fa-solid fa-mug-hot text-amber-500 transition-transform duration-300 group-hover:-rotate-12 group-hover:scale-110"
		></i
		><span class="hidden sm:inline">Buy me a coffee</span></a
	>
</header>
