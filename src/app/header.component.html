<header class="relative flex items-center gap-1 bg-nav px-2 shadow-lg sm:gap-3 sm:px-4 dark:shadow-black/40">
	<app-header-nav class="flex min-h-11 min-w-9 flex-1 items-center" [items]="items" />

	<app-savegame-selector />

	<label
		class="inline-flex shrink-0 items-center gap-1 text-nav-fg"
		i18n-title
		title="Language of the game names and descriptions"
	>
		<svg lucideLanguages class="hidden opacity-80 sm:inline-block" />
		<select
			class="input h-8 w-16 py-0 text-sm sm:w-auto"
			i18n-aria-label
			aria-label="Game text language"
			[formField]="languageForm.language"
		>
			@for (language of languages; track language.code) {
				<option [value]="language.code">{{ language.name }}</option>
			}
		</select>
	</label>

	<button
		type="button"
		role="switch"
		class="relative inline-flex h-7 w-13 shrink-0 cursor-pointer items-center rounded-full border border-line-strong bg-surface-2 transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-500"
		[attr.aria-checked]="theme.isDark()"
		i18n-aria-label
		aria-label="Dark theme"
		[title]="theme.isDark() ? switchToLight : switchToDark"
		(click)="theme.toggle()"
	>
		<span
			class="absolute top-0.5 left-0.5 flex size-5.5 items-center justify-center rounded-full bg-white text-xs text-amber-500 shadow transition-transform dark:translate-x-6 dark:bg-neutral-900 dark:text-sky-300"
		>
			@if (theme.isDark()) {
				<svg lucideMoon />
			} @else {
				<svg lucideSun />
			}
		</span>
	</button>

	<app-support-menu />

	<a
		routerLink="/about"
		routerLinkActive="!text-fg-strong bg-nav-active"
		class="inline-flex size-9 shrink-0 items-center justify-center rounded-md text-nav-fg hover:bg-hover hover:text-fg-strong"
		i18n-aria-label
		aria-label="About"
		i18n-title
		title="About"
		><svg lucideInfo
	/></a>
</header>
