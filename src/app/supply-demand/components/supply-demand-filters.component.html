<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
	<label class="text-sm">
		<ng-container i18n>Scope</ng-container>
		<select id="supply-scope" class="input" [formField]="form.scope">
			<option value="galaxy" i18n>Whole galaxy</option>
			<option value="faction" i18n>A faction</option>
			<option value="sector" i18n>Around a sector</option>
		</select>
	</label>
	<app-option-select
		class="text-sm"
		inputId="supply-faction"
		i18n-label
		label="Faction"
		i18n-allLabel
		allLabel="Pick a faction"
		[options]="store.factions()"
		[formField]="form.faction"
	/>
	<app-sector-input
		class="text-sm"
		inputId="supply-sector"
		i18n-label
		label="Sector"
		i18n-placeholder
		placeholder="Pick a sector"
		[sectors]="store.sectors()"
		[formField]="form.sector"
	/>
	<label class="text-sm" [attr.title]="store.jumpsHint()">
		<ng-container i18n>Jumps</ng-container>
		<input id="supply-jumps" class="input" type="number" [formField]="form.jumps" />
	</label>
	<app-option-select
		class="text-sm"
		inputId="supply-group"
		i18n-label
		label="Ware group"
		i18n-allLabel
		allLabel="All groups"
		[options]="store.groups()"
		[formField]="form.group"
	/>
</div>
<app-more-filters class="mt-3 block" storageKey="supply-demand-more-filters" [active]="store.moreFiltersSet()">
	<div class="flex flex-wrap gap-x-6 gap-y-2">
		<label class="flex items-center gap-2">
			<input id="supply-player" type="checkbox" [formField]="form.player" />
			<ng-container i18n>Include my stations</ng-container>
		</label>
		<label class="flex items-center gap-2">
			<input id="supply-mined" type="checkbox" [formField]="form.mined" />
			<ng-container i18n>Show mined resources</ng-container>
		</label>
		<label class="flex items-center gap-2">
			<input id="supply-hostile" type="checkbox" [formField]="form.hideHostile" />
			<ng-container i18n>Hide hostile factions</ng-container>
		</label>
	</div>
</app-more-filters>
