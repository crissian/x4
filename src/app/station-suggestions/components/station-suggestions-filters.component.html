<div class="flex flex-wrap gap-3">
	<fieldset class="inline-flex overflow-hidden rounded-md border border-line text-sm" data-mode>
		<legend class="sr-only" i18n>What to suggest</legend>
		<label
			class="cursor-pointer px-3 py-1.5 has-checked:bg-primary has-checked:text-white has-focus-visible:outline-2"
		>
			<input id="suggest-mode-where" class="sr-only" type="radio" [value]="modes.WHERE" [formField]="form.mode" />
			<ng-container i18n>Where to build</ng-container>
		</label>
		<label
			class="cursor-pointer border-l border-line px-3 py-1.5 has-checked:bg-primary has-checked:text-white has-focus-visible:outline-2"
		>
			<input id="suggest-mode-here" class="sr-only" type="radio" [value]="modes.HERE" [formField]="form.mode" />
			<ng-container i18n>What to build here</ng-container>
		</label>
	</fieldset>
	<fieldset class="inline-flex overflow-hidden rounded-md border border-line text-sm" data-loop>
		<legend class="sr-only" i18n>How the station gets its inputs</legend>
		<label
			class="cursor-pointer px-3 py-1.5 has-checked:bg-primary has-checked:text-white has-focus-visible:outline-2"
			title="The station makes its whole production chain; your miners bring the raw resources"
			i18n-title
		>
			<input
				id="suggest-loop-closed"
				class="sr-only"
				type="radio"
				[value]="modes.CLOSED"
				[formField]="form.loop"
			/>
			<ng-container i18n>Closed loop</ng-container>
		</label>
		<label
			class="cursor-pointer border-l border-line px-3 py-1.5 has-checked:bg-primary has-checked:text-white has-focus-visible:outline-2"
			title="The station buys its inputs at average prices"
			i18n-title
		>
			<input id="suggest-loop-open" class="sr-only" type="radio" [value]="modes.OPEN" [formField]="form.loop" />
			<ng-container i18n>Buy inputs</ng-container>
		</label>
	</fieldset>
	<fieldset class="inline-flex overflow-hidden rounded-md border border-line text-sm" data-rank>
		<legend class="sr-only" i18n>Rank by</legend>
		<label
			class="cursor-pointer px-3 py-1.5 has-checked:bg-primary has-checked:text-white has-focus-visible:outline-2"
			title="Expected Cr/h times the resources and sunlight factors"
			i18n-title
		>
			<input id="suggest-rank-score" class="sr-only" type="radio" value="score" [formField]="form.rank" />
			<ng-container i18n>Best overall</ng-container>
		</label>
		<label
			class="cursor-pointer border-l border-line px-3 py-1.5 has-checked:bg-primary has-checked:text-white has-focus-visible:outline-2"
			title="The most Expected Cr/h, whatever the station costs"
			i18n-title
		>
			<input id="suggest-rank-income" class="sr-only" type="radio" value="income" [formField]="form.rank" />
			<ng-container i18n>Most Cr/h</ng-container>
		</label>
		<label
			class="cursor-pointer border-l border-line px-3 py-1.5 has-checked:bg-primary has-checked:text-white has-focus-visible:outline-2"
			title="The shortest payback of the build cost, whatever the station's size"
			i18n-title
		>
			<input id="suggest-rank-payback" class="sr-only" type="radio" value="payback" [formField]="form.rank" />
			<ng-container i18n>Fastest payback</ng-container>
		</label>
	</fieldset>
</div>
<div class="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
	@if (store.here()) {
		<app-sector-input
			class="text-sm"
			inputId="suggest-sector"
			i18n-label
			label="Sector"
			i18n-placeholder
			placeholder="Pick a sector"
			[sectors]="store.sectors()"
			[formField]="form.sector"
		/>
	} @else {
		<app-searchable-select
			class="text-sm"
			inputId="suggest-ware"
			i18n-label
			label="Ware"
			i18n-allLabel
			allLabel="All wares"
			[options]="wareOptions()"
			[formField]="form.ware"
		/>
	}
	<label class="text-sm">
		<ng-container i18n>Sells within jumps</ng-container>
		<input id="suggest-jumps" class="input" type="number" [formField]="form.jumps" />
	</label>
	<app-option-select
		class="text-sm"
		inputId="suggest-group"
		i18n-label
		label="Ware group"
		i18n-allLabel
		allLabel="All groups"
		[options]="store.groups()"
		[formField]="form.group"
	/>
</div>
<div class="mt-3 flex flex-wrap gap-x-6 gap-y-2">
	<label class="flex items-center gap-2">
		<input id="suggest-hostile" type="checkbox" [formField]="form.hideHostile" />
		<ng-container i18n>Hide hostile sectors</ng-container>
	</label>
	<label class="flex items-center gap-2">
		<input id="suggest-player" type="checkbox" [formField]="form.player" />
		<ng-container i18n>Include my stations</ng-container>
	</label>
</div>
