<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>X4: Foundations / Kingdom End</title>
		<base href="/" />

		<meta
			name="description"
			content="X4: Foundations / Split Vendetta / Cradle of Humanity / Tides of Avarice / Kingdom End station planner / calculator, database, ships, wares, races, factions. Plan your station modules layout by calculating production and resource needs."
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<script>
			// apply the theme before the app loads to avoid a flash of the wrong theme (see ThemeService)
			(function () {
				var theme = null;
				try {
					theme = localStorage.getItem('theme');
				} catch (e) {}
				if (theme !== 'light' && theme !== 'dark') {
					theme =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				}
				if (theme === 'dark') {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
	</head>
	<body>
		<app-root></app-root>

		<script async src="https://www.googletagmanager.com/gtag/js?id=UA-130883167-1"></script>
		<script>
			window.dataLayer = window.dataLayer || [];

			function gtag() {
				dataLayer.push(arguments);
			}

			gtag('js', new Date());

			gtag('config', 'UA-130883167-1', { send_page_view: false });
		</script>
	</body>
</html>
